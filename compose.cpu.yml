# Standalone on a shared four-core host. No GPU, external worker, or tunnel.
name: lost-landscapes
x-environment: &environment
  DATA_DIR: /data/lost-landscapes
  REDIS_URL: redis://redis:6379/0
  ENABLE_ANALYSIS: ${ENABLE_ANALYSIS:-false}
  PARALLEL_TILES: 1
  DERIVATIVE_WORKERS: 2
  DETECTION_WORKERS: 2
  DOWNLOAD_WORKERS: 2
  TERRAIN_WORKERS: 2
  SCAN_TILE_LIMIT: 4
  PROJ_NETWORK: "OFF"
  OMP_NUM_THREADS: 1
  OPENBLAS_NUM_THREADS: 1
  GDAL_NUM_THREADS: 1
services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.cpu
    image: ${LANDSCAPES_IMAGE:-lost-landscapes:local}
    restart: unless-stopped
    ports: ["127.0.0.1:${LANDSCAPES_PORT:-9750}:8000"]
    env_file: ["${LANDSCAPES_ENV_FILE:-.env}"]
    environment: *environment
    volumes: ["./data:/data/lost-landscapes"]
    cpus: 2
    mem_limit: 2g
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 5s
      start_period: 60s
  db:
    profiles: [analysis]
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    env_file: ["${LANDSCAPES_ENV_FILE:-.env}"]
    environment:
      POSTGRES_DB: landscapes
      POSTGRES_USER: landscapes
    volumes: ["postgres:/var/lib/postgresql/data"]
    command: ["postgres", "-c", "shared_buffers=256MB", "-c", "work_mem=16MB", "-c", "max_connections=40"]
    mem_limit: 1g
    cpus: 1
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U landscapes"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    profiles: [analysis]
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "192mb", "--maxmemory-policy", "noeviction"]
    volumes: ["redis:/data"]
    mem_limit: 256m
    cpus: 0.5
  migrate:
    profiles: [analysis]
    image: ${LANDSCAPES_IMAGE:-lost-landscapes:local}
    command: ["uv", "run", "alembic", "upgrade", "head"]
    env_file: ["${LANDSCAPES_ENV_FILE:-.env}"]
    environment: *environment
    depends_on:
      db: {condition: service_healthy}
  worker:
    profiles: [analysis]
    image: ${LANDSCAPES_IMAGE:-lost-landscapes:local}
    restart: unless-stopped
    command: ["uv", "run", "celery", "-A", "lost_landscapes.workers.celery_app", "worker", "--loglevel=info", "--concurrency=1", "-Q", "default,ingest,process,detect"]
    env_file: ["${LANDSCAPES_ENV_FILE:-.env}"]
    environment: *environment
    volumes: ["./data:/data/lost-landscapes"]
    cpus: 2
    mem_limit: 7g
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_started}
volumes:
  postgres:
  redis:
