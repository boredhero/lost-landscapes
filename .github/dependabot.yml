version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    target-branch: master
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/New_York
    open-pull-requests-limit: 5
    groups:
      weekly-uv:
        patterns: ["*"]
        update-types: [minor, patch]
    commit-message:
      prefix: "deps"
  - package-ecosystem: "npm"
    directory: "/frontend"
    target-branch: master
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/New_York
    open-pull-requests-limit: 5
    groups:
      weekly-npm:
        patterns: ["*"]
        update-types: [minor, patch]
    commit-message:
      prefix: "deps"
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: master
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/New_York
    open-pull-requests-limit: 5
    groups:
      weekly-github-actions:
        patterns: ["*"]
        update-types: [minor, patch]
    commit-message:
      prefix: "deps"
  - package-ecosystem: "docker"
    directory: "/"
    target-branch: master
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/New_York
    open-pull-requests-limit: 5
    groups:
      weekly-docker:
        patterns: ["*"]
        update-types: [minor, patch]
    commit-message:
      prefix: "deps"
