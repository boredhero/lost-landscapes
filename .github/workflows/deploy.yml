name: Deploy production
on:
  push:
    branches: [master]
permissions:
  contents: read
concurrency:
  group: production-deployment
  cancel-in-progress: false
jobs:
  checks:
    if: github.ref == 'refs/heads/master'
    uses: ./.github/workflows/test.yml
  deploy:
    needs: checks
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: production
      url: https://anomalies.martinospizza.dev
    steps:
      - uses: actions/checkout@v7
      - name: Configure dedicated deployment identity
        env:
          DEPLOY_KEY: ${{ secrets.LANDSCAPES_DEPLOY_KEY }}
          HOST_KEYS: ${{ secrets.LANDSCAPES_KNOWN_HOSTS }}
        run: |
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_KEY" > "$HOME/.ssh/landscapes"
          chmod 600 "$HOME/.ssh/landscapes"
          printf '%s\n' "$HOST_KEYS" > "$HOME/.ssh/known_hosts"
      - name: Deploy tested commit to the CPU host
        env:
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git archive --format=tar.gz "$DEPLOY_SHA" | ssh -i "$HOME/.ssh/landscapes" \
            -o BatchMode=yes -o StrictHostKeyChecking=yes \
            noah@boredhero.dyndns.org "$DEPLOY_SHA"
      - name: Verify public endpoint
        run: curl --fail --silent --show-error --retry 6 --retry-all-errors --retry-delay 5 https://anomalies.martinospizza.dev/api/health
